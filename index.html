<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PacketLens</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="update-bar" class="update-bar page-inset-x" hidden>
  <span id="update-bar-text"></span>
  <a id="update-bar-link" class="btn sm" target="_blank" rel="noopener">Değişiklikleri gör</a>
  <button class="btn sm ghost" data-act="update-dismiss">Kapat</button>
</div>
<header class="top page-inset-x">
  <div class="brand"><span class="logo" aria-hidden="true">◎</span><b>PacketLens</b></div>
  <div class="top-actions">
    <div class="menu" id="menu">
      <button class="btn" data-act="menu" id="b-menu" aria-haspopup="true" aria-expanded="false">Menü</button>
      <div class="menu-pop" id="menu-pop" hidden>
        <div class="menu-lab">Görünüm</div>
        <div class="seg wide" role="group" aria-label="Mod">
          <button data-act="mode" data-v="simple" id="m-simple">Basit</button>
          <button data-act="mode" data-v="adv" id="m-adv">Gelişmiş</button>
        </div>
        <div class="menu-lab">Dil</div>
        <div class="seg wide" role="group" aria-label="Language">
          <button data-act="lang" data-v="tr" id="l-tr" title="Türkçe">TR</button>
          <button data-act="lang" data-v="en" id="l-en" title="English">EN</button>
        </div>
        <hr>
        <button class="menu-item" data-act="open">Dosya aç</button>
        <button class="menu-item" data-act="settings">Ayarlar</button>
      </div>
    </div>
    <button class="btn primary" data-act="analyze" id="b-live">Canlı analiz</button>
    <input type="file" id="file" accept=".pcap,.pcapng,.cap" hidden>
  </div>
</header>

<div id="livebar" class="livebar page-inset-x" hidden></div>

<main id="main">
  <section id="home" class="home">
    <p class="home-idle" id="home-idle"></p>
    <div id="live-after" class="live-after" hidden></div>
    <div id="live-home"></div>
  </section>

  <section id="app" hidden>
    <div class="searchbox">
      <div class="sb-row">
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder='Ara, sor ya da filtre yaz: "yavaş dns", "google.com", ip.addr == 192.168.1.23 && tcp.port == 443   ( / tuşu ile odaklan )'>
        <button class="btn ghost" data-act="clearq" id="clearq" hidden>Temizle</button>
        <button class="btn" data-act="fl-lib" title="Hazır filtreler ve filtre rehberi">Filtreler</button>
        <button class="btn" data-act="fl-export" title="Rapor, CSV, JSON, .pcap">Dışa aktar</button>
      </div>
      <div class="sb-meta" id="qmeta"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="view" class="view"></div>
  </section>
</main>

<div id="drawer-bg" class="drawer-bg" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Ayrıntı"></aside>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="i18n.js"></script>
<script src="lang-en.js"></script>
<script src="parser.js"></script>
<script src="tlspassive.js"></script>
<script src="filter.js"></script>
<script src="extras.js"></script>
<script src="tools.js"></script>
<script src="pl-boot.js"></script>
<script src="app.js"></script>
<script src="views.js"></script>
<script src="features.js"></script>
<script src="ptentes-ui.js"></script>
<script src="update.js"></script>
</body>
</html>
